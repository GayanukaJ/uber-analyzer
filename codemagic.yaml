workflows:
  android-workflow:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Recreate Android folder
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: Fix v1 embedding
        script: |
          # Remove the v1 embedding marker that causes the error
          find . -name "*.gradle" -exec grep -l "flutterEmbedding" {} \; | xargs sed -i '' 's/flutterEmbedding = 1/flutterEmbedding = 2/g' 2>/dev/null || true
          # Ensure local.properties exists
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          # Remove any v1 embedding flags
          grep -r "v1EmbeddingSupport\|flutterEmbedding" android/ || echo "No v1 markers found"

      - name: Restore AndroidManifest
        script: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Uber Analyzer"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name="im.zoe.labs.flutter_notification_listener.NotificationListener"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <activity
                      android:name="com.example.flutter_overlay_window.OverlayEntryPoint"
                      android:exported="false"
                      android:hardwareAccelerated="true"
                      android:theme="@style/Theme.AppCompat.Translucent" />
                  <service
                      android:name="id.flutter.flutter_background_service.BackgroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />
                  <receiver
                      android:name="id.flutter.flutter_background_service.BackgroundServiceReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Show gradle files for debug
        script: |
          cat android/app/build.gradle
          echo "---"
          cat android/local.properties

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
