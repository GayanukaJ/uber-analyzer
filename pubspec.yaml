name: uber_analyzer
description: Uber trip notification analyzer - shows Rs/km rate as overlay popup

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Reads Android notifications from other apps
  # Requires BIND_NOTIFICATION_LISTENER_SERVICE permission
  flutter_notification_listener: ^0.9.0

  # Draw overlay window on top of other apps (floating popup)
  # Requires SYSTEM_ALERT_WINDOW permission
  flutter_overlay_window: ^0.4.6

  # Check and request runtime permissions
  permission_handler: ^11.3.1

  # Shared preferences for storing settings (thresholds, history)
  shared_preferences: ^2.2.3

  # For background isolate communication
  flutter_background_service: ^5.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
